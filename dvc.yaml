stages:
  dry_run:
    cmd: python eval/scripts/run_dry_run.py
    metrics:
      - metrics/dry_run_metrics.json:
          cache: false
    plots:
      - plots/dry_run_curves.csv:
          cache: false

  eval_swebench_cl:
    cmd: python eval/benchmarks/swebench_cl_runner.py --limit ${eval.limit}
    params:
      - eval.limit
    metrics:
      - metrics/swebench_cl_metrics.json:
          cache: false
    plots:
      - plots/swebench_cl_curves.csv:
          cache: false

  eval_devbench:
    cmd: python eval/benchmarks/devbench_runner.py --limit ${eval.limit}
    params:
      - eval.limit
    metrics:
      - metrics/devbench_metrics.json:
          cache: false
    plots:
      - plots/devbench_curves.csv:
          cache: false

  eval_intercode:
    cmd: python eval/benchmarks/intercode_runner.py --limit ${eval.limit}
    params:
      - eval.limit
    metrics:
      - metrics/intercode_metrics.json:
          cache: false
    plots:
      - plots/intercode_curves.csv:
          cache: false

  aggregate_metrics:
    cmd: python eval/scripts/aggregate_metrics.py
    metrics:
      - metrics/summary_metrics.json:
          cache: false
    plots:
      - plots/comparative_summary.csv:
          cache: false
