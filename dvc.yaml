stages:
  dry_run:
    cmd: python eval/scripts/run_dry_run.py
    deps:
      - eval/scripts/run_dry_run.py
    metrics:
      - eval/metrics/dry_run_metrics.json:
          cache: false
    plots:
      - eval/plots/dry_run_curves.csv:
          cache: false

  eval_swebench_cl:
    cmd: python eval/benchmarks/swebench_cl_runner.py --limit ${eval.limit} --max-turns ${eval.max_turns} --max-tokens ${eval.max_tokens} --max-cost ${eval.max_cost_per_instance_usd} --model ${eval.model} --reset-checkpoint
    params:
      - eval.limit
      - eval.max_turns
      - eval.max_tokens
      - eval.max_cost_per_instance_usd
      - eval.model
    deps:
      - eval/benchmarks/swebench_cl_runner.py
    metrics:
      - eval/metrics/swebench_cl_metrics.json:
          cache: false
    plots:
      - eval/plots/swebench_cl_curves.csv:
          cache: false

  eval_devbench:
    cmd: python eval/benchmarks/devbench_runner.py --limit ${eval.limit} --max-turns ${eval.max_turns} --max-tokens ${eval.max_tokens} --max-cost ${eval.max_cost_per_instance_usd} --model ${eval.model} --reset-checkpoint
    params:
      - eval.limit
      - eval.max_turns
      - eval.max_tokens
      - eval.max_cost_per_instance_usd
      - eval.model
    deps:
      - eval/benchmarks/devbench_runner.py
    metrics:
      - eval/metrics/devbench_metrics.json:
          cache: false
    plots:
      - eval/plots/devbench_curves.csv:
          cache: false

  eval:
    cmd: python eval/scripts/aggregate_metrics.py
    deps:
      - eval/scripts/aggregate_metrics.py
      - eval/metrics/swebench_cl_metrics.json
      - eval/metrics/devbench_metrics.json
    metrics:
      - eval/metrics/summary_metrics.json:
          cache: false
    plots:
      - eval/plots/comparative_summary.csv:
          cache: false
