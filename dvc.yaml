stages:
  dvc-code-analysis:
    cmd: bash .dvc-viewer/bootstrap.sh && dvc-viewer hash
    always_changed: true
    outs:
    - .dvc-viewer/hashes: {cache: false}

  # =========================================================================
  # SWE-bench-CL Matrix (3 Models x 2 Arms)
  # =========================================================================
  eval_swebench_cl_gemini_flash_aivc:
    cmd: python eval/benchmarks/swebench_cl_runner.py --limit ${eval.limit} --max-turns ${eval.max_turns} --max-tokens ${eval.max_tokens} --max-cost ${eval.max_cost_per_instance_usd} --model google/gemini-3.7-flash --arm aivc --metrics-file eval/metrics/swebench_cl_gemini_flash_aivc_metrics.json --curves-file eval/plots/swebench_cl_gemini_flash_aivc_curves.csv --checkpoint-file eval/checkpoints/swebench_cl_gemini_flash_aivc_checkpoint.jsonl
    params: [eval.limit, eval.max_turns, eval.max_tokens, eval.max_cost_per_instance_usd]
    deps: [eval/benchmarks/swebench_cl_runner.py, .dvc-viewer/hashes/eval_swebench_cl.hash]
    outs:
    - eval/metrics/swebench_cl_gemini_flash_aivc_tool_interactions.jsonl: {cache: false}
    metrics:
    - eval/metrics/swebench_cl_gemini_flash_aivc_metrics.json: {cache: false}
    plots:
    - eval/plots/swebench_cl_gemini_flash_aivc_curves.csv: {cache: false}

