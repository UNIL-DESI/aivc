# Multi-Provider Models Registry for AIVC Evaluation & Benchmarks
# Centralized registry of supported LLMs across providers (OpenRouter, Together AI),
# token pricing ($/1M tokens), batch discounts, context windows, and capabilities.
#
# Supported Providers:
# - 'openrouter': Routes to OpenRouter API (https://openrouter.ai/api/v1/chat/completions) using OPENROUTER_API_KEY.
# - 'together': Routes to Together AI API (https://api.together.ai/v1/chat/completions) using TOGETHER_API_KEY.
#   Supports 50% discount on Batch Inference API for offline evaluations.

default_model: "google/gemini-3.7-flash"

models:
