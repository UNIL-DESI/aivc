  # 1. Closed-source Frontier API (via OpenRouter)
  # ---------------------------------------------------------------------------
  "google/gemini-3.7-flash":
    name: "Gemini 3.7 Flash"
    provider: "openrouter"
    prompt_price_per_1m: 0.05
    completion_price_per_1m: 0.20
    context_window: 1000000
    supports_tools: true
    description: "Frontier multimodal & long-context model with 1M context window (via OpenRouter)."

  # ---------------------------------------------------------------------------
  # 2. Datacenter Open-weights (via Together AI)
  # ---------------------------------------------------------------------------
