<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVC | Dashboard & Vue Keep</title>
    <script src="vendor/cytoscape.min.js"></script>
    <script src="vendor/cytoscape-fcose.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.75);
            --border-color: rgba(48, 54, 61, 0.6);
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.35);
            --highlight: #d2a8ff;
            --add-color: #7ee787;
            --del-color: #ff7b72;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #cy {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Glassmorphism utility */
        .glass {
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        /* Header Container: Top Bar & View Switcher */
        .header-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 12px;
            width: auto;
            max-width: 95vw;
        }

        .view-switcher {
            display: flex;
            background: rgba(22, 27, 34, 0.85);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .switcher-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .switcher-btn:hover {
            color: var(--text-main);
        }

        .switcher-btn.active {
            background: var(--accent);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .top-bar {
            width: 440px;
            display: flex;
            align-items: center;
            padding: 4px 16px;
            height: 48px;
        }

        .top-bar input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            width: 100%;
            padding: 8px 4px;
            outline: none;
        }

        .top-bar input::placeholder {
            color: var(--text-muted);
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .reset-btn {
            display: none;
            background: transparent;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            margin-left: 8px;
            min-height: 44px;
            padding: 0 8px;
        }

        .reset-btn:hover {
            color: var(--highlight);
        }

        .relayout-btn {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            padding: 8px 16px;
            min-height: 44px;
            transition: all 0.2s;
        }
        .relayout-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* Sidebar: Graph Results */
        .sidebar {
            position: absolute;
            top: 24px;
            right: -400px;
            bottom: 24px;
            width: 350px;
            z-index: 15;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar.open {
            right: 24px;
        }

        .sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        /* Keep View Container */
        .keep-container {
            position: absolute;
            top: 86px;
            left: 24px;
            right: 24px;
            bottom: 24px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .keep-filter-bar {
            display: flex;
            gap: 8px;
            padding: 8px 14px;
            align-self: center;
            border-radius: 30px;
            margin-bottom: 4px;
        }

        .filter-pill {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
        }

        .filter-pill:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .filter-pill.active {
            background: rgba(88, 166, 255, 0.18);
            color: var(--accent);
            border-color: var(--accent);
            font-weight: 600;
        }

        /* Keep Grid */
        .keep-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            padding-bottom: 40px;
        }

        /* Keep Card */
        .keep-card {
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            min-height: 180px;
        }

        .keep-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 8px 24px rgba(88, 166, 255, 0.15);
        }

        .keep-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }

        .keep-card-title {
            font-size: 16px;
            font-weight: 600;
            color: #f0f6fc;
            margin: 0;
            line-height: 1.35;
            word-break: break-word;
        }

        .keep-card-id {
            font-family: monospace;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .keep-card-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .keep-card-snippet {
            font-size: 13px;
            color: var(--text-main);
            line-height: 1.5;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            opacity: 0.9;
        }

        .keep-media-thumb {
            width: 100%;
            max-height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .keep-card-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin-top: auto;
            padding-top: 8px;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-add {
            background: rgba(126, 231, 135, 0.15);
            color: var(--add-color);
            border: 1px solid rgba(126, 231, 135, 0.3);
        }

        .badge-del {
            background: rgba(255, 123, 114, 0.15);
            color: var(--del-color);
            border: 1px solid rgba(255, 123, 114, 0.3);
        }

        .badge-view {
            background: rgba(210, 168, 255, 0.15);
            color: var(--highlight);
            border: 1px solid rgba(210, 168, 255, 0.3);
        }

        .badge-file {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            font-weight: 400;
        }

        /* Detail Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-card {
            width: 100%;
            max-width: 850px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            background: #161b22;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        .modal-title-group h2 {
            margin: 0 0 6px 0;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .modal-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .modal-close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            min-width: 44px;
            min-height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-note {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px 20px;
            font-size: 14px;
            line-height: 1.65;
            white-space: pre-wrap;
            margin-bottom: 24px;
            color: var(--text-main);
        }

        .modal-media-container {
            margin-bottom: 24px;
            text-align: center;
        }

        .modal-media-full {
            max-width: 100%;
            max-height: 350px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .modal-pdf-embed {
            width: 100%;
            height: 400px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
        }

        .modal-section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--highlight);
            margin: 0 0 12px 0;
        }

        /* Accordion Diffs */
        .accordion-item {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
        }

        .accordion-header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
            min-height: 44px;
        }

        .accordion-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .accordion-content {
            padding: 12px;
            border-top: 1px solid var(--border-color);
            background: #0d1117;
            font-family: monospace;
            font-size: 12px;
            overflow-x: auto;
        }

        .diff-line {
            white-space: pre-wrap;
            word-break: break-all;
            padding: 2px 6px;
            line-height: 1.4;
        }

        .diff-add {
            background: rgba(46, 160, 67, 0.2);
            color: var(--add-color);
        }

        .diff-del {
            background: rgba(218, 54, 51, 0.2);
            color: var(--del-color);
        }

        .diff-hunk {
            background: rgba(56, 139, 253, 0.15);
            color: #79c0ff;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        /* Loader Overlay */
        #init-loader {
            position: absolute;
            inset: 0;
            background: var(--bg-color);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: var(--text-muted);
            font-size: 18px;
            transition: opacity 0.5s;
        }
        #init-loader .big-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        /* Mobile Media Queries */
        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                width: 92vw;
                top: 12px;
                gap: 8px;
            }
            .top-bar {
                width: 100% !important;
            }
            .keep-container {
                top: 140px;
                left: 12px;
                right: 12px;
                bottom: 12px;
            }
            .keep-grid {
                grid-template-columns: 1fr;
            }
            .modal-overlay {
                padding: 0;
                align-items: flex-end;
            }
            .modal-card {
                border-radius: 20px 20px 0 0;
                max-height: 85vh;
            }
        }
    </style>
</head>
<body>

    <div id="init-loader">
        <div class="big-spinner"></div>
        <div>Chargement du Dashboard AIVC...</div>
    </div>

    <!-- Header Container: View Switcher & Search Bar -->
    <div class="header-container">
        <!-- View Switcher -->
        <div class="view-switcher glass">
            <button class="switcher-btn active" id="btnViewGraph" title="Vue Graphique Cytoscape">🌐 Graphe</button>
            <button class="switcher-btn" id="btnViewKeep" title="Vue Grille Keep">📌 Grille Keep</button>
        </div>

        <!-- Search Bar -->
        <div class="top-bar glass">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); margin-right: 8px; flex-shrink: 0;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="Recherche sémantique dans la mémoire..." autocomplete="off">
            <div class="spinner" id="searchSpinner"></div>
            <button class="reset-btn" id="resetBtn">Réinitialiser</button>
        </div>
    </div>

    <!-- Graph View Container -->
    <div id="cy"></div>

    <!-- Relayout Button -->
    <button class="relayout-btn" id="relayoutBtn" title="Relancer la simulation graphique">⟳ Relayout</button>

    <!-- Graph Sidebar -->
    <div class="sidebar glass" id="sidebar">
        <div class="sidebar-header">
            <h2 id="resultsTitle">Résultats</h2>
        </div>
        <div class="sidebar-content" id="resultsContent">
            <!-- Graph Sidebar Cards -->
        </div>
    </div>

    <!-- Keep View Container -->
    <div id="keep-container" class="keep-container" style="display: none;">
        <div class="keep-filter-bar glass">
            <button class="filter-pill active" data-filter="all">Tous</button>
            <button class="filter-pill" data-filter="modified">Modifiés ✏️</button>
            <button class="filter-pill" data-filter="consulted">Consultés 👁️</button>
        </div>
        <div id="keep-grid" class="keep-grid">
            <!-- Keep Cards rendered dynamically -->
        </div>
    </div>

    <!-- Full Detail Modal -->
    <div id="detail-modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title-group">
                    <h2 id="modalTitle">Titre de la Mémoire</h2>
                    <div class="modal-meta" id="modalMeta"></div>
                </div>
                <button class="modal-close-btn" id="modalCloseBtn" title="Fermer">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Modal content loaded dynamically -->
            </div>
        </div>
    </div>

    <script>
        // Color Hash for Cytoscape directories
        function hashColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            let hue = Math.abs(hash) % 360;
            return `hsl(${hue}, 70%, 65%)`;
        }

        function isImageFile(path) {
            if (!path) return false;
            const ext = path.split('.').pop().toLowerCase();
            return ['png', 'jpg', 'jpeg', 'webp', 'svg'].includes(ext);
        }

        function isPdfFile(path) {
            if (!path) return false;
            return path.split('.').pop().toLowerCase() === 'pdf';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            let currentView = 'graph'; // 'graph' or 'keep'
            let activeKeepFilter = 'all'; // 'all', 'modified', 'consulted'
            let keepMemories = [];
            let currentSearchQuery = '';

            // Debounce & AbortController setup
            let searchAbortController = null;
            let searchDebounceTimer = null;

            // DOM Elements
            const btnViewGraph = document.getElementById('btnViewGraph');
            const btnViewKeep = document.getElementById('btnViewKeep');
            const cyContainer = document.getElementById('cy');
            const relayoutBtn = document.getElementById('relayoutBtn');
            const sidebar = document.getElementById('sidebar');
            const keepContainer = document.getElementById('keep-container');
            const keepGrid = document.getElementById('keep-grid');
            const searchInput = document.getElementById('searchInput');
            const searchSpinner = document.getElementById('searchSpinner');
            const resetBtn = document.getElementById('resetBtn');
            const resultsTitle = document.getElementById('resultsTitle');
            const resultsContent = document.getElementById('resultsContent');
            const modalOverlay = document.getElementById('detail-modal-overlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalMeta = document.getElementById('modalMeta');
            const modalBody = document.getElementById('modalBody');
            const modalCloseBtn = document.getElementById('modalCloseBtn');

            // 1. Fetch Graph Data
            let graphData = { nodes: [], edges: [] };
            try {
                const res = await fetch('/api/graph');
                graphData = await res.json();
            } catch (err) {
                console.error("Failed to load graph data", err);
                document.getElementById('init-loader').innerHTML = '<div style="color:#ff7b72;">Erreur de connexion au serveur AIVC.</div>';
                return;
            }

            // Cytoscape Elements Setup
            const elements = [];
            const maxMemoryCnt = graphData.nodes.reduce((max, n) => Math.max(max, n.memory_count), 1);
            graphData.nodes.forEach(n => {
                elements.push({
                    data: {
                        id: n.id,
                        label: n.label,
                        dir: n.directory,
                        size: 10 + (Math.log1p(n.memory_count) / Math.log1p(maxMemoryCnt)) * 20,
                        color: hashColor(n.directory)
                    }
                });
            });

            const maxWeight = graphData.edges.reduce((max, e) => Math.max(max, e.weight), 1);
            graphData.edges.forEach(e => {
                elements.push({
                    data: {
                        source: e.source,
                        target: e.target,
                        weight: e.weight,
                        opacity: 0.1 + (e.weight / maxWeight) * 0.4
                    }
                });
            });

            // Initialize Cytoscape
            const cy = cytoscape({
                container: cyContainer,
                elements: elements,
                style: [
                    {
                        selector: 'node',
                        style: {
                            'background-color': 'data(color)',
                            'width': 'data(size)',
                            'height': 'data(size)',
                            'label': 'data(label)',
                            'color': '#c9d1d9',
                            'font-size': '11px',
                            'font-family': 'Inter, sans-serif',
                            'text-valign': 'bottom',
                            'text-margin-y': 6,
                            'text-outline-width': 2,
                            'text-outline-color': '#0d1117',
                            'transition-property': 'background-color, line-color, target-arrow-color, width, height, opacity',
                            'transition-duration': '0.3s'
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 'mapData(weight, 1, 10, 1, 4)',
                            'line-color': '#444',
                            'opacity': 'data(opacity)',
                            'curve-style': 'bezier',
                            'transition-property': 'opacity',
                            'transition-duration': '0.3s'
                        }
                    },
                    {
                        selector: 'node.highlight',
                        style: {
                            'border-width': 3,
                            'border-color': '#fff',
                            'width': ele => ele.data('size') * (1.1 + (ele.data('relevance') || 0) * 0.9),
                            'height': ele => ele.data('size') * (1.1 + (ele.data('relevance') || 0) * 0.9),
                            'z-index': 100,
                            'color': '#ffffff',
                            'font-weight': 'bold',
                            'font-size': '13px'
                        }
                    },
                    {
                        selector: 'node.selected',
                        style: {
                            'border-width': 4,
                            'border-color': '#58a6ff',
                            'width': ele => ele.data('size') * 1.8,
                            'height': ele => ele.data('size') * 1.8,
                            'z-index': 200,
                            'color': '#ffffff',
                            'font-weight': 'bold',
                            'font-size': '14px',
                            'shadow-blur': 20,
                            'shadow-color': 'rgba(88, 166, 255, 0.6)',
                            'shadow-opacity': 1
                        }
                    },
                    {
                        selector: 'node.neighbor',
                        style: {
                            'border-width': 2,
                            'border-color': '#d2a8ff',
                            'width': ele => ele.data('size') * (1.0 + (ele.data('relevance') || 0) * 0.8),
                            'height': ele => ele.data('size') * (1.0 + (ele.data('relevance') || 0) * 0.8),
                            'z-index': 150,
                            'color': '#e0e0e0',
                            'font-weight': '500',
                            'font-size': '12px'
                        }
                    },
                    {
                        selector: 'edge.neighbor-edge',
                        style: {
                            'line-color': 'rgba(210, 168, 255, 0.6)',
                            'opacity': 0.8,
                            'width': 'mapData(weight, 1, 10, 2, 5)',
                            'z-index': 100
                        }
                    },
                    {
                        selector: 'node.dim',
                        style: { 'opacity': 0.12, 'color': '#333' }
                    },
                    {
                        selector: 'edge.dim',
                        style: { 'opacity': 0.04 }
                    }
                ],
                layout: {
                    name: 'cose',
                    animate: true,
                    animationDuration: 800,
                    fit: true,
                    padding: 40,
                    randomize: true,
                    nodeRepulsion: () => 12000,
                    idealEdgeLength: (edge) => Math.max(40, 180 / edge.data('weight')),
                    edgeElasticity: (edge) => edge.data('weight') * 80,
                    gravity: 0.4,
                    numIter: 1000
                },
                wheelSensitivity: 0.1
            });

            // Remove initial loader
            setTimeout(() => {
                const loader = document.getElementById('init-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }
            }, 600);

            // View Switcher Handlers
            btnViewGraph.addEventListener('click', () => switchView('graph'));
            btnViewKeep.addEventListener('click', () => switchView('keep'));

            function switchView(view) {
                currentView = view;
                if (view === 'graph') {
                    btnViewGraph.classList.add('active');
                    btnViewKeep.classList.remove('active');
                    cyContainer.style.display = 'block';
                    relayoutBtn.style.display = 'block';
                    keepContainer.style.display = 'none';
                    sidebar.classList.add('open');
                } else {
                    btnViewKeep.classList.add('active');
                    btnViewGraph.classList.remove('active');
                    cyContainer.style.display = 'none';
                    relayoutBtn.style.display = 'none';
                    sidebar.classList.remove('open');
                    keepContainer.style.display = 'flex';
                    loadKeepMemories();
                }
            }

            relayoutBtn.addEventListener('click', () => {
                cy.layout({
                    name: 'cose',
                    animate: true,
                    animationDuration: 800,
                    fit: true,
                    padding: 40,
                    randomize: false,
                    nodeRepulsion: () => 12000,
                    idealEdgeLength: (edge) => Math.max(40, 180 / edge.data('weight')),
                    edgeElasticity: (edge) => edge.data('weight') * 80,
                    gravity: 0.4
                }).run();
            });

            // 2. Fetch and Load Memories for Keep View
            async function loadKeepMemories() {
                try {
                    let url = currentSearchQuery 
                        ? `/api/search?q=${encodeURIComponent(currentSearchQuery)}`
                        : `/api/log?offset=0&limit=50`;
                    
                    const res = await fetch(url);
                    keepMemories = await res.json();
                    renderKeepGrid();
                } catch (err) {
                    keepGrid.innerHTML = `<div style="color: var(--del-color); padding: 20px;">Erreur de chargement: ${err.message}</div>`;
                }
            }

            // Keep View Filter Tabs
            document.querySelectorAll('.filter-pill').forEach(pill => {
                pill.addEventListener('click', () => {
                    document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    activeKeepFilter = pill.getAttribute('data-filter');
                    renderKeepGrid();
                });
            });

            function renderKeepGrid() {
                let filtered = keepMemories;
                if (activeKeepFilter === 'modified') {
                    filtered = filtered.filter(m => m.has_modified || (m.changes && m.changes.some(c => c.action !== 'consulted')));
                } else if (activeKeepFilter === 'consulted') {
                    filtered = filtered.filter(m => m.has_consulted || (m.changes && m.changes.some(c => c.action === 'consulted')));
                }

                if (filtered.length === 0) {
                    keepGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">Aucune mémoire trouvée pour ce filtre.</div>`;
                    return;
                }

                keepGrid.innerHTML = filtered.map(m => {
                    const id = m.id || m.memory_id;
                    const dateStr = (m.timestamp || '').substring(0, 10);
                    const shortId = id ? id.substring(0, 8) : '';
                    const snippet = m.snippet || m.note || '';

                    // Find media blob if any
                    let mediaHash = null;
                    if (m.changes) {
                        const mediaChange = m.changes.find(c => isImageFile(c.path) && c.blob_hash);
                        if (mediaChange) mediaHash = mediaChange.blob_hash;
                    }

                    const added = m.lines_added || 0;
                    const removed = m.lines_removed || 0;
                    const consultedCount = m.changes ? m.changes.filter(c => c.action === 'consulted').length : 0;

                    return `
                        <div class="keep-card" data-memory-id="${id}">
                            <div>
                                <div class="keep-card-header">
                                    <h3 class="keep-card-title">${escapeHtml(m.title || 'Mémoire')}</h3>
                                    <span class="keep-card-id">${shortId}</span>
                                </div>
                                <div class="keep-card-meta">
                                    <span>📅 ${dateStr}</span>
                                    <span>${(m.changes || []).length} fichier(s)</span>
                                </div>
                                ${mediaHash ? `<img src="/api/blob/${mediaHash}" class="keep-media-thumb" loading="lazy" alt="Aperçu média" />` : ''}
                                <div class="keep-card-snippet">${escapeHtml(snippet)}</div>
                            </div>
                            <div class="keep-card-badges">
                                ${added > 0 ? `<span class="badge badge-add">+${added}</span>` : ''}
                                ${removed > 0 ? `<span class="badge badge-del">-${removed}</span>` : ''}
                                ${consultedCount > 0 ? `<span class="badge badge-view">👁 ${consultedCount}</span>` : ''}
                                ${(m.changes || []).slice(0, 2).map(c => `
                                    <span class="badge badge-file" title="${escapeHtml(c.path)}">${escapeHtml(c.path.split('/').pop())}</span>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }).join('');

                // Bind Keep Card Clicks
                document.querySelectorAll('.keep-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const memoryId = card.getAttribute('data-memory-id');
                        openDetailModal(memoryId);
                    });
                });
            }

            // 3. Search Logic with Debounce & AbortController
            searchInput.addEventListener('input', () => {
                const query = searchInput.value.trim();
                currentSearchQuery = query;

                if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() => {
                    executeSearch(query);
                }, 300);
            });

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
                    executeSearch(searchInput.value.trim());
                }
            });

            resetBtn.addEventListener('click', () => {
                searchInput.value = '';
                currentSearchQuery = '';
                if (searchAbortController) searchAbortController.abort();
                resetSearch();
            });

            async function executeSearch(query) {
                if (searchAbortController) {
                    searchAbortController.abort();
                }
                searchAbortController = new AbortController();

                if (!query) {
                    resetSearch();
                    return;
                }

                searchSpinner.style.display = 'block';
                resetBtn.style.display = 'none';

                try {
                    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`, {
                        signal: searchAbortController.signal
                    });
                    const results = await res.json();
                    searchSpinner.style.display = 'none';
                    resetBtn.style.display = 'block';

                    if (currentView === 'graph') {
                        renderGraphSearchResults(results);
                    } else {
                        keepMemories = results;
                        renderKeepGrid();
                    }
                } catch (err) {
                    if (err.name === 'AbortError') return;
                    console.error("Search fetch error", err);
                    searchSpinner.style.display = 'none';
                    resetBtn.style.display = 'block';
                }
            }

            function resetSearch() {
                searchSpinner.style.display = 'none';
                resetBtn.style.display = 'none';
                cy.batch(() => {
                    cy.elements().removeClass('highlight dim selected neighbor neighbor-edge');
                    cy.nodes().removeData('relevance');
                });
                if (currentView === 'keep') {
                    loadKeepMemories();
                } else {
                    loadGitLogSidebar();
                }
            }

            // Render Search in Graph Sidebar
            function renderGraphSearchResults(memories) {
                sidebar.classList.add('open');
                resultsTitle.innerText = `${memories.length} Résultat(s)`;

                if (memories.length === 0) {
                    resultsContent.innerHTML = `<p style="color: var(--text-muted);">Aucun résultat pour cette recherche.</p>`;
                    return;
                }

                resultsContent.innerHTML = memories.map(c => `
                    <div class="keep-card" style="margin-bottom: 12px;" data-memory-id="${c.memory_id}">
                        <h3 class="keep-card-title">${escapeHtml(c.title)}</h3>
                        <div class="keep-card-meta">
                            <span>${(c.timestamp || '').substring(0, 10)}</span>
                            <span>Score: ${c.score.toFixed(3)}</span>
                        </div>
                        <p class="keep-card-snippet">${escapeHtml(c.snippet)}</p>
                    </div>
                `).join('');

                document.querySelectorAll('#resultsContent .keep-card').forEach(card => {
                    card.addEventListener('click', () => {
                        openDetailModal(card.getAttribute('data-memory-id'));
                    });
                });
            }

            // Sidebar Git Log
            async function loadGitLogSidebar() {
                resultsTitle.innerText = "Git Log";
                resultsContent.innerHTML = '<div style="text-align:center; padding: 20px;"><div class="spinner" style="display:inline-block;"></div></div>';
                sidebar.classList.add('open');

                try {
                    const res = await fetch('/api/log?offset=0&limit=20');
                    const logs = await res.json();

                    resultsContent.innerHTML = logs.map(c => `
                        <div class="keep-card" style="margin-bottom: 12px;" data-memory-id="${c.id}">
                            <h3 class="keep-card-title">${escapeHtml(c.title)}</h3>
                            <div class="keep-card-meta">
                                <span>${(c.timestamp || '').substring(0, 10)}</span>
                                <span class="keep-card-id">${c.id.substring(0, 8)}</span>
                            </div>
                            <div class="keep-card-badges">
                                ${c.lines_added > 0 ? `<span class="badge badge-add">+${c.lines_added}</span>` : ''}
                                ${c.lines_removed > 0 ? `<span class="badge badge-del">-${c.lines_removed}</span>` : ''}
                            </div>
                        </div>
                    `).join('');

                    document.querySelectorAll('#resultsContent .keep-card').forEach(card => {
                        card.addEventListener('click', () => {
                            openDetailModal(card.getAttribute('data-memory-id'));
                        });
                    });
                } catch (err) {
                    resultsContent.innerHTML = `<p style="color: var(--del-color);">Erreur: ${err.message}</p>`;
                }
            }

            // Cytoscape Node Tap -> show file history in sidebar
            cy.on('tap', 'node', async (e) => {
                const node = e.target;
                sidebar.classList.add('open');
                resultsTitle.innerText = `Fichier: ${node.data('label')}`;
                resultsContent.innerHTML = '<div style="text-align:center; padding: 20px;"><div class="spinner" style="display:inline-block;"></div></div>';

                try {
                    const res = await fetch(`/api/file-history/${encodeURIComponent(node.id())}`);
                    const history = await res.json();

                    if (history.error) {
                        resultsContent.innerHTML = `<p style="color: var(--del-color);">${history.error}</p>`;
                        return;
                    }

                    resultsContent.innerHTML = history.map(c => `
                        <div class="keep-card" style="margin-bottom: 12px;" data-memory-id="${c.memory_id}">
                            <h3 class="keep-card-title">${escapeHtml(c.title)}</h3>
                            <div class="keep-card-meta">
                                <span>${(c.timestamp || '').substring(0, 10)}</span>
                                <span class="keep-card-id">${c.memory_id.substring(0, 8)}</span>
                            </div>
                        </div>
                    `).join('');

                    document.querySelectorAll('#resultsContent .keep-card').forEach(card => {
                        card.addEventListener('click', () => {
                            openDetailModal(card.getAttribute('data-memory-id'));
                        });
                    });
                } catch (err) {
                    resultsContent.innerHTML = `<p style="color: var(--del-color);">Erreur: ${err.message}</p>`;
                }
            });

            // 4. Full Detail Modal & Accordion Diffs
            async function openDetailModal(memoryId) {
                modalOverlay.style.display = 'flex';
                modalTitle.innerText = 'Chargement...';
                modalMeta.innerHTML = '';
                modalBody.innerHTML = '<div style="text-align:center; padding: 40px;"><div class="spinner" style="display:inline-block; width:30px; height:30px;"></div></div>';

                try {
                    const res = await fetch(`/api/memory/${memoryId}`);
                    const memory = await res.json();

                    if (memory.error) {
                        modalTitle.innerText = 'Erreur';
                        modalBody.innerHTML = `<p style="color: var(--del-color);">${memory.error}</p>`;
                        return;
                    }

                    modalTitle.innerText = memory.title;
                    modalMeta.innerHTML = `
                        <span>📅 ${(memory.timestamp || '').substring(0, 19).replace('T', ' ')}</span>
                        <span class="keep-card-id">ID: ${memory.id.substring(0, 8)}</span>
                        ${memory.parent_id ? `<span class="keep-card-id" style="cursor:pointer;" title="Aller au parent" id="parentMemoryBtn">Parent: ${memory.parent_id.substring(0, 8)}</span>` : ''}
                    `;

                    if (document.getElementById('parentMemoryBtn')) {
                        document.getElementById('parentMemoryBtn').addEventListener('click', () => {
                            openDetailModal(memory.parent_id);
                        });
                    }

                    // Check for images or PDF media
                    let mediaHtml = '';
                    const mediaChange = memory.changes.find(c => (isImageFile(c.path) || isPdfFile(c.path)) && c.blob_hash);
                    if (mediaChange) {
                        if (isImageFile(mediaChange.path)) {
                            mediaHtml = `
                                <div class="modal-media-container">
                                    <img src="/api/blob/${mediaChange.blob_hash}" class="modal-media-full" alt="Media preview" />
                                </div>
                            `;
                        } else if (isPdfFile(mediaChange.path)) {
                            mediaHtml = `
                                <div class="modal-media-container">
                                    <iframe src="/api/blob/${mediaChange.blob_hash}" class="modal-pdf-embed"></iframe>
                                </div>
                            `;
                        }
                    }

                    // Render Body
                    modalBody.innerHTML = `
                        <div class="modal-note">${escapeHtml(memory.note)}</div>
                        ${mediaHtml}
                        <h3 class="modal-section-title">Modifications & Diffs (${memory.changes.length})</h3>
                        <div class="accordion-group">
                            ${memory.changes.map((c, idx) => `
                                <div class="accordion-item" data-path="${escapeHtml(c.path)}" data-memory-id="${memory.id}">
                                    <div class="accordion-header">
                                        <div>
                                            <span class="badge ${c.action === 'added' ? 'badge-add' : c.action === 'deleted' ? 'badge-del' : c.action === 'consulted' ? 'badge-view' : 'badge-file'}">${c.action}</span>
                                            <strong style="margin-left: 8px; color: #f0f6fc;">${escapeHtml(c.path.split('/').pop())}</strong>
                                            <span style="color: var(--text-muted); font-size: 11px; margin-left: 6px;">(${escapeHtml(c.path)})</span>
                                        </div>
                                        <div>
                                            ${c.lines_added > 0 ? `<span class="badge badge-add">+${c.lines_added}</span>` : ''}
                                            ${c.lines_removed > 0 ? `<span class="badge badge-del">-${c.lines_removed}</span>` : ''}
                                            <span style="color: var(--text-muted); margin-left: 8px;">▼</span>
                                        </div>
                                    </div>
                                    <div class="accordion-content" id="accordion-content-${idx}" style="display: none;">
                                        <div style="text-align:center; padding: 12px;"><div class="spinner" style="display:inline-block;"></div></div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;

                    // Accordion Toggle Handlers
                    document.querySelectorAll('.accordion-header').forEach((header, idx) => {
                        header.addEventListener('click', async () => {
                            const content = document.getElementById(`accordion-content-${idx}`);
                            const isHidden = content.style.display === 'none';

                            if (isHidden) {
                                content.style.display = 'block';
                                if (!content.getAttribute('data-loaded')) {
                                    const item = header.parentElement;
                                    const path = item.getAttribute('data-path');
                                    const memId = item.getAttribute('data-memory-id');

                                    try {
                                        const diffRes = await fetch(`/api/diff?memory_id=${memId}&path=${encodeURIComponent(path)}`);
                                        const diffData = await diffRes.json();

                                        if (diffData.error) {
                                            content.innerHTML = `<div style="color: var(--del-color);">${diffData.error}</div>`;
                                        } else if (diffData.is_binary) {
                                            content.innerHTML = `<div style="color: var(--highlight);">[Fichier binaire ou média - détection automatique]</div>`;
                                        } else {
                                            const lines = (diffData.diff || '').split('\n');
                                            content.innerHTML = lines.map(line => {
                                                let cls = '';
                                                if (line.startsWith('+') && !line.startsWith('+++')) cls = 'diff-add';
                                                else if (line.startsWith('-') && !line.startsWith('---')) cls = 'diff-del';
                                                else if (line.startsWith('@@')) cls = 'diff-hunk';

                                                return `<div class="diff-line ${cls}">${escapeHtml(line)}</div>`;
                                            }).join('');
                                        }
                                        content.setAttribute('data-loaded', 'true');
                                    } catch (err) {
                                        content.innerHTML = `<div style="color: var(--del-color);">Erreur diff: ${err.message}</div>`;
                                    }
                                }
                            } else {
                                content.style.display = 'none';
                            }
                        });
                    });

                } catch (err) {
                    modalTitle.innerText = 'Erreur';
                    modalBody.innerHTML = `<p style="color: var(--del-color);">${err.message}</p>`;
                }
            }

            modalCloseBtn.addEventListener('click', () => {
                modalOverlay.style.display = 'none';
            });

            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) {
                    modalOverlay.style.display = 'none';
                }
            });

            function escapeHtml(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            // Default Startup Load
            loadGitLogSidebar();
        });
    </script>
</body>
</html>
