<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVC | Dashboard & Vue Keep</title>
    <script src="vendor/cytoscape.min.js"></script>
    <script src="vendor/cytoscape-fcose.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.75);
            --border-color: rgba(48, 54, 61, 0.6);
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.35);
            --highlight: #d2a8ff;
            --add-color: #7ee787;
            --del-color: #ff7b72;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #cy {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            display: none;
        }

        /* Glassmorphism utility */
        .glass {
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        /* Header Container: Top Bar & View Switcher */
        .header-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 12px;
            width: auto;
            max-width: 95vw;
        }

        .view-switcher {
            display: flex;
            background: rgba(22, 27, 34, 0.85);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .switcher-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .switcher-btn:hover {
            color: var(--text-main);
        }

        .switcher-btn.active {
            background: var(--accent);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .top-bar {
            width: 440px;
            display: flex;
            align-items: center;
            padding: 4px 16px;
            height: 48px;
        }

        .top-bar input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            width: 100%;
            padding: 8px 4px;
            outline: none;
        }

        .top-bar input::placeholder {
            color: var(--text-muted);
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .reset-btn {
            display: none;
            background: transparent;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            margin-left: 8px;
            min-height: 44px;
            padding: 0 8px;
        }

        .reset-btn:hover {
            color: var(--highlight);
        }

        .relayout-btn {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            padding: 8px 16px;
            min-height: 44px;
            transition: all 0.2s;
            display: none;
        }
        .relayout-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* Sidebar: Graph Results */
        .sidebar {
            position: absolute;
            top: 24px;
            right: -400px;
            bottom: 24px;
            width: 350px;
            z-index: 15;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar.open {
            right: 24px;
        }

        .sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        /* Keep View Container */
        .keep-container {
            position: absolute;
            top: 86px;
            left: 24px;
            right: 24px;
            bottom: 24px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .keep-filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 14px;
            align-self: center;
            border-radius: 30px;
            margin-bottom: 4px;
        }

        .filter-pill {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .filter-pill:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .filter-pill.active {
            background: rgba(88, 166, 255, 0.18);
            color: var(--accent);
            border-color: var(--accent);
            font-weight: 600;
        }

        .filter-pill.commit-pill {
            background: rgba(210, 168, 255, 0.2);
            color: var(--highlight);
            border-color: var(--highlight);
        }

        .remove-pill-btn {
            font-weight: bold;
            margin-left: 4px;
            cursor: pointer;
            opacity: 0.8;
        }
        .remove-pill-btn:hover {
            opacity: 1;
            color: #ffffff;
        }

        /* Keep Grid */
        .keep-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            padding-bottom: 40px;
        }

        /* Keep Card Base */
        .keep-card {
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            cursor: pointer;
            min-height: 190px;
        }

        .keep-card:hover {
            transform: translateY(-3px);
        }

        /* Keep Card Pastel Themes (Dark & Light adaptative) */
        .keep-card.theme-added {
            background: rgba(46, 125, 50, 0.22);
            border: 1px solid rgba(126, 231, 135, 0.45);
        }
        .keep-card.theme-added:hover {
            border-color: #7ee787;
            box-shadow: 0 8px 24px rgba(126, 231, 135, 0.25);
        }

        .keep-card.theme-modified {
            background: rgba(180, 110, 10, 0.22);
            border: 1px solid rgba(245, 158, 11, 0.45);
        }
        .keep-card.theme-modified:hover {
            border-color: #f59e0b;
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.25);
        }

        .keep-card.theme-deleted {
            background: rgba(190, 30, 60, 0.22);
            border: 1px solid rgba(255, 123, 114, 0.45);
        }
        .keep-card.theme-deleted:hover {
            border-color: #ff7b72;
            box-shadow: 0 8px 24px rgba(255, 123, 114, 0.25);
        }

        .keep-card.theme-consulted {
            background: rgba(14, 130, 200, 0.22);
            border: 1px solid rgba(56, 189, 248, 0.45);
        }
        .keep-card.theme-consulted:hover {
            border-color: #38bdf8;
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.25);
        }

        @media (prefers-color-scheme: light) {
            .keep-card.theme-added {
                background: #e6f4ea;
                border-color: #ceead6;
                color: #137333;
            }
            .keep-card.theme-added .keep-card-title { color: #137333; }

            .keep-card.theme-modified {
                background: #fef7e0;
                border-color: #feefc3;
                color: #b06000;
            }
            .keep-card.theme-modified .keep-card-title { color: #b06000; }

            .keep-card.theme-deleted {
                background: #fce8e6;
                border-color: #fad2cf;
                color: #c5221f;
            }
            .keep-card.theme-deleted .keep-card-title { color: #c5221f; }

            .keep-card.theme-consulted {
                background: #e8f0fe;
                border-color: #d2e3fc;
                color: #1a73e8;
            }
            .keep-card.theme-consulted .keep-card-title { color: #1a73e8; }
        }

        .keep-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }

        .keep-card-title {
            font-size: 16px;
            font-weight: 600;
            color: #f0f6fc;
            margin: 0;
            line-height: 1.35;
            word-break: break-word;
        }

        .keep-card-id {
            font-family: monospace;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .keep-card-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .commit-btn {
            background: rgba(88, 166, 255, 0.12);
            border: 1px solid rgba(88, 166, 255, 0.3);
            color: var(--accent);
            font-size: 11px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .commit-btn:hover {
            background: rgba(88, 166, 255, 0.25);
            border-color: var(--accent);
        }

        .detail-btn {
            background: rgba(210, 168, 255, 0.12);
            border: 1px solid rgba(210, 168, 255, 0.3);
            color: var(--highlight);
            font-size: 11px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .detail-btn:hover {
            background: rgba(210, 168, 255, 0.25);
            border-color: var(--highlight);
        }

        .keep-card-snippet {
            font-size: 13px;
            color: var(--text-main);
            line-height: 1.5;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            opacity: 0.95;
        }

        .keep-media-thumb {
            width: 100%;
            max-height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .keep-card-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin-top: auto;
            padding-top: 8px;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-add {
            background: rgba(126, 231, 135, 0.18);
            color: var(--add-color);
            border: 1px solid rgba(126, 231, 135, 0.35);
        }

        .badge-del {
            background: rgba(255, 123, 114, 0.18);
            color: var(--del-color);
            border: 1px solid rgba(255, 123, 114, 0.35);
        }

        .badge-view {
            background: rgba(210, 168, 255, 0.18);
            color: var(--highlight);
            border: 1px solid rgba(210, 168, 255, 0.35);
        }

        .badge-file {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .badge-file:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Detail Modal & 2-Column Desktop Layout */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-card {
            width: 100%;
            max-width: 1100px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            background: #161b22;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .modal-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            background: rgba(22, 27, 34, 0.9);
            flex-shrink: 0;
        }

        .modal-title-group h2 {
            margin: 0 0 4px 0;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .modal-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .modal-close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            min-width: 44px;
            min-height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* 2-Column Content Grid */
        .modal-content-grid {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .modal-left-col {
            width: 340px;
            min-width: 280px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px;
            background: rgba(13, 17, 23, 0.5);
            flex-shrink: 0;
        }

        .modal-right-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            background: #0d1117;
        }

        .modal-note {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        /* File Tree Styling */
        .tree-container {
            margin-top: 8px;
        }

        .tree-dir {
            margin-left: 4px;
            margin-top: 4px;
        }

        .tree-summary {
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            padding: 4px 6px;
            border-radius: 6px;
            user-select: none;
            transition: background 0.15s;
        }

        .tree-summary:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .tree-children {
            padding-left: 10px;
            border-left: 1px dashed rgba(255, 255, 255, 0.15);
            margin-left: 6px;
        }

        .tree-file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            margin: 3px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.15s ease, border-color 0.15s ease;
            border: 1px solid transparent;
        }

        .tree-file-item:hover {
            background: rgba(88, 166, 255, 0.12);
        }

        .tree-file-item.selected {
            background: rgba(88, 166, 255, 0.22);
            border-color: var(--accent);
            font-weight: 600;
        }

        .tree-file-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #f0f6fc;
        }

        .tree-file-badges {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .modal-media-container {
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-media-full {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .modal-pdf-embed {
            width: 100%;
            height: 450px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
        }

        .modal-section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--highlight);
            margin: 0 0 12px 0;
        }

        /* Diff Viewer */
        .diff-viewer {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: #0d1117;
            font-family: monospace;
            font-size: 12px;
            overflow-x: auto;
            padding: 12px;
        }

        .diff-line {
            white-space: pre-wrap;
            word-break: break-all;
            padding: 2px 6px;
            line-height: 1.45;
        }

        .diff-add {
            background: rgba(46, 160, 67, 0.2);
            color: var(--add-color);
        }

        .diff-del {
            background: rgba(218, 54, 51, 0.2);
            color: var(--del-color);
        }

        .diff-hunk {
            background: rgba(56, 139, 253, 0.15);
            color: #79c0ff;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        /* Loader Overlay */
        #init-loader {
            position: absolute;
            inset: 0;
            background: var(--bg-color);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: var(--text-muted);
            font-size: 18px;
            transition: opacity 0.5s;
        }
        #init-loader .big-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        /* Mobile Media Queries & Bottom-Sheet */
        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                width: 92vw;
                top: 12px;
                gap: 8px;
            }
            .top-bar {
                width: 100% !important;
            }
            .keep-container {
                top: 140px;
                left: 12px;
                right: 12px;
                bottom: 12px;
            }
            .keep-grid {
                grid-template-columns: 1fr;
            }
            
            /* Bottom-Sheet for Mobile */
            .modal-overlay {
                padding: 0;
                align-items: flex-end;
            }
            .modal-card {
                border-radius: 20px 20px 0 0;
                height: 90vh;
                max-height: 90vh;
                animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            }
            @keyframes slideUp {
                from { transform: translateY(100%); }
                to { transform: translateY(0); }
            }
            .modal-content-grid {
                flex-direction: column;
                overflow-y: auto;
            }
            .modal-left-col {
                width: 100%;
                min-width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                max-height: 40vh;
            }
            .modal-right-col {
                width: 100%;
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <div id="init-loader">
        <div class="big-spinner"></div>
        <div>Chargement du Dashboard AIVC...</div>
    </div>

    <!-- Header Container: View Switcher & Search Bar -->
    <div class="header-container">
        <!-- View Switcher -->
        <div class="view-switcher glass">
            <button class="switcher-btn" id="btnViewGraph" title="Vue Graphique Cytoscape">🌐 Graphe</button>
            <button class="switcher-btn active" id="btnViewKeep" title="Vue Grille Keep">📌 Grille Keep</button>
        </div>

        <!-- Search Bar -->
        <div class="top-bar glass">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); margin-right: 8px; flex-shrink: 0;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="Recherche sémantique dans la mémoire..." autocomplete="off">
            <div class="spinner" id="searchSpinner"></div>
            <button class="reset-btn" id="resetBtn">Réinitialiser</button>
        </div>
    </div>

    <!-- Graph View Container -->
    <div id="cy"></div>

    <!-- Relayout Button -->
    <button class="relayout-btn" id="relayoutBtn" title="Relancer la simulation graphique">⟳ Relayout</button>

    <!-- Graph Sidebar -->
    <div class="sidebar glass" id="sidebar">
        <div class="sidebar-header">
            <h2 id="resultsTitle">Résultats</h2>
        </div>
        <div class="sidebar-content" id="resultsContent">
            <!-- Graph Sidebar Cards -->
        </div>
    </div>

    <!-- Keep View Container (Default View) -->
    <div id="keep-container" class="keep-container">
        <div class="keep-filter-bar glass" id="keep-filter-bar">
            <button class="filter-pill active" data-filter="all">Tous</button>
            <button class="filter-pill" data-filter="modified">Modifiés ✏️</button>
            <button class="filter-pill" data-filter="consulted">Consultés 👁️</button>
        </div>
        <div id="keep-grid" class="keep-grid">
            <!-- Keep Cards rendered dynamically -->
        </div>
    </div>

    <!-- Full Detail Modal (2-Column Desktop / Bottom-Sheet Mobile) -->
    <div id="detail-modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title-group">
                    <h2 id="modalTitle">Titre de la Mémoire</h2>
                    <div class="modal-meta" id="modalMeta"></div>
                </div>
                <button class="modal-close-btn" id="modalCloseBtn" title="Fermer">✕</button>
            </div>
            <div class="modal-content-grid" id="modalContentGrid">
                <div class="modal-left-col" id="modalLeftCol"></div>
                <div class="modal-right-col" id="modalRightCol"></div>
            </div>
        </div>
    </div>

    <script>
        // Color Hash for Cytoscape directories
        function hashColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            let hue = Math.abs(hash) % 360;
            return `hsl(${hue}, 70%, 65%)`;
        }

        function isImageFile(path) {
            if (!path) return false;
            const ext = path.split('.').pop().toLowerCase();
            return ['png', 'jpg', 'jpeg', 'webp', 'svg'].includes(ext);
        }

        function isPdfFile(path) {
            if (!path) return false;
            return path.split('.').pop().toLowerCase() === 'pdf';
        }

        function getCardThemeClass(m) {
            const changes = m.changes || [];
            const actions = changes.map(c => typeof c === 'string' ? 'modified' : c.action);
            const hasAdded = actions.includes('added') || (m.lines_added && m.lines_added > 0);
            const hasDeleted = actions.includes('deleted') || (m.lines_removed && m.lines_removed > 0);
            const hasModified = actions.includes('modified') || m.has_modified;
            const isConsultedOnly = actions.length > 0 && actions.every(a => a === 'consulted');

            if (isConsultedOnly) return 'theme-consulted';
            if (hasAdded) return 'theme-added';
            if (hasModified) return 'theme-modified';
            if (hasDeleted) return 'theme-deleted';
            return 'theme-modified';
        }

        function buildFileTree(changes) {
            const root = { _isDir: true, name: '', children: {} };
            (changes || []).forEach(c => {
                const path = typeof c === 'string' ? c : c.path;
                const parts = path.split('/').filter(Boolean);
                let current = root;
                parts.forEach((part, idx) => {
                    if (idx === parts.length - 1) {
                        current.children[part] = { _isDir: false, name: part, path: path, change: c };
                    } else {
                        if (!current.children[part]) {
                            current.children[part] = { _isDir: true, name: part, children: {} };
                        }
                        current = current.children[part];
                    }
                });
            });
            return root;
        }

        function renderTreeNodes(node) {
            let html = '';
            const keys = Object.keys(node.children || {}).sort((a, b) => {
                const isDirA = node.children[a]._isDir;
                const isDirB = node.children[b]._isDir;
                if (isDirA && !isDirB) return -1;
                if (!isDirA && isDirB) return 1;
                return a.localeCompare(b);
            });

            keys.forEach(key => {
                const item = node.children[key];
                if (item._isDir) {
                    html += `
                        <details class="tree-dir" open>
                            <summary class="tree-summary">📁 ${escapeHtml(item.name)}</summary>
                            <div class="tree-children">
                                ${renderTreeNodes(item)}
                            </div>
                        </details>
                    `;
                } else {
                    const c = item.change;
                    const action = typeof c === 'string' ? 'modified' : (c.action || 'modified');
                    const added = typeof c === 'string' ? 0 : (c.lines_added || 0);
                    const removed = typeof c === 'string' ? 0 : (c.lines_removed || 0);
                    const actionBadgeClass = action === 'added' ? 'badge-add' : action === 'deleted' ? 'badge-del' : action === 'consulted' ? 'badge-view' : 'badge-file';

                    html += `
                        <div class="tree-file-item" data-path="${escapeHtml(item.path)}">
                            <span class="tree-file-name" title="${escapeHtml(item.path)}">📄 ${escapeHtml(item.name)}</span>
                            <div class="tree-file-badges">
                                <span class="badge ${actionBadgeClass}">${action}</span>
                                ${added > 0 ? `<span class="badge badge-add">+${added}</span>` : ''}
                                ${removed > 0 ? `<span class="badge badge-del">-${removed}</span>` : ''}
                            </div>
                        </div>
                    `;
                }
            });
            return html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            let currentView = 'keep'; // Default view: 'keep'
            let activeKeepFilter = 'all'; // 'all', 'modified', 'consulted'
            let activeCommitFilter = null; // { id, hash }
            let keepMemories = [];
            let currentSearchQuery = '';

            // Debounce & AbortController setup
            let searchAbortController = null;
            let searchDebounceTimer = null;

            // DOM Elements
            const btnViewGraph = document.getElementById('btnViewGraph');
            const btnViewKeep = document.getElementById('btnViewKeep');
            const cyContainer = document.getElementById('cy');
            const relayoutBtn = document.getElementById('relayoutBtn');
            const sidebar = document.getElementById('sidebar');
            const keepContainer = document.getElementById('keep-container');
            const keepGrid = document.getElementById('keep-grid');
            const keepFilterBar = document.getElementById('keep-filter-bar');
            const searchInput = document.getElementById('searchInput');
            const searchSpinner = document.getElementById('searchSpinner');
            const resetBtn = document.getElementById('resetBtn');
            const resultsTitle = document.getElementById('resultsTitle');
            const resultsContent = document.getElementById('resultsContent');
            const modalOverlay = document.getElementById('detail-modal-overlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalMeta = document.getElementById('modalMeta');
            const modalLeftCol = document.getElementById('modalLeftCol');
            const modalRightCol = document.getElementById('modalRightCol');
            const modalCloseBtn = document.getElementById('modalCloseBtn');

            // 1. Load Keep Memories by default
            loadKeepMemories();

            // 2. Fetch Graph Data in background for Cytoscape
            let cy = null;
            let graphDataLoaded = false;

            async function initCytoscape() {
                if (graphDataLoaded) return;
                try {
                    const res = await fetch('/api/graph');
                    const graphData = await res.json();

                    const elements = [];
                    const maxMemoryCnt = graphData.nodes.reduce((max, n) => Math.max(max, n.memory_count), 1);
                    graphData.nodes.forEach(n => {
                        elements.push({
                            data: {
                                id: n.id,
                                label: n.label,
                                dir: n.directory,
                                size: 10 + (Math.log1p(n.memory_count) / Math.log1p(maxMemoryCnt)) * 20,
                                color: hashColor(n.directory)
                            }
                        });
                    });

                    const maxWeight = graphData.edges.reduce((max, e) => Math.max(max, e.weight), 1);
                    graphData.edges.forEach(e => {
                        elements.push({
                            data: {
                                source: e.source,
                                target: e.target,
                                weight: e.weight,
                                opacity: 0.1 + (e.weight / maxWeight) * 0.4
                            }
                        });
                    });

                    cy = cytoscape({
                        container: cyContainer,
                        elements: elements,
                        style: [
                            {
                                selector: 'node',
                                style: {
                                    'background-color': 'data(color)',
                                    'width': 'data(size)',
                                    'height': 'data(size)',
                                    'label': 'data(label)',
                                    'color': '#c9d1d9',
                                    'font-size': '11px',
                                    'font-family': 'Inter, sans-serif',
                                    'text-valign': 'bottom',
                                    'text-margin-y': 6,
                                    'text-outline-width': 2,
                                    'text-outline-color': '#0d1117',
                                    'transition-property': 'background-color, line-color, target-arrow-color, width, height, opacity',
                                    'transition-duration': '0.3s'
                                }
                            },
                            {
                                selector: 'edge',
                                style: {
                                    'width': 'mapData(weight, 1, 10, 1, 4)',
                                    'line-color': '#444',
                                    'opacity': 'data(opacity)',
                                    'curve-style': 'bezier',
                                    'transition-property': 'opacity',
                                    'transition-duration': '0.3s'
                                }
                            },
                            {
                                selector: 'node.highlight',
                                style: {
                                    'border-width': 3,
                                    'border-color': '#fff',
                                    'width': ele => ele.data('size') * (1.1 + (ele.data('relevance') || 0) * 0.9),
                                    'height': ele => ele.data('size') * (1.1 + (ele.data('relevance') || 0) * 0.9),
                                    'z-index': 100,
                                    'color': '#ffffff',
                                    'font-weight': 'bold',
                                    'font-size': '13px'
                                }
                            },
                            {
                                selector: 'node.selected',
                                style: {
                                    'border-width': 4,
                                    'border-color': '#58a6ff',
                                    'width': ele => ele.data('size') * 1.8,
                                    'height': ele => ele.data('size') * 1.8,
                                    'z-index': 200,
                                    'color': '#ffffff',
                                    'font-weight': 'bold',
                                    'font-size': '14px',
                                    'shadow-blur': 20,
                                    'shadow-color': 'rgba(88, 166, 255, 0.6)',
                                    'shadow-opacity': 1
                                }
                            }
                        ],
                        layout: {
                            name: 'cose',
                            animate: true,
                            animationDuration: 800,
                            fit: true,
                            padding: 40,
                            randomize: true,
                            nodeRepulsion: () => 12000,
                            idealEdgeLength: (edge) => Math.max(40, 180 / edge.data('weight')),
                            edgeElasticity: (edge) => edge.data('weight') * 80,
                            gravity: 0.4
                        },
                        wheelSensitivity: 0.1
                    });

                    cy.on('tap', 'node', async (e) => {
                        const node = e.target;
                        openFileHistoryModal(node.id());
                    });

                    graphDataLoaded = true;
                } catch (err) {
                    console.error("Failed to load graph data", err);
                }
            }

            // Remove initial loader
            setTimeout(() => {
                const loader = document.getElementById('init-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }
            }, 500);

            // View Switcher Handlers
            btnViewGraph.addEventListener('click', () => switchView('graph'));
            btnViewKeep.addEventListener('click', () => switchView('keep'));

            function switchView(view) {
                currentView = view;
                if (view === 'graph') {
                    btnViewGraph.classList.add('active');
                    btnViewKeep.classList.remove('active');
                    cyContainer.style.display = 'block';
                    relayoutBtn.style.display = 'block';
                    keepContainer.style.display = 'none';
                    sidebar.classList.add('open');
                    initCytoscape();
                    loadGitLogSidebar();
                } else {
                    btnViewKeep.classList.add('active');
                    btnViewGraph.classList.remove('active');
                    cyContainer.style.display = 'none';
                    relayoutBtn.style.display = 'none';
                    sidebar.classList.remove('open');
                    keepContainer.style.display = 'flex';
                    loadKeepMemories();
                }
            }

            relayoutBtn.addEventListener('click', () => {
                if (cy) {
                    cy.layout({
                        name: 'cose',
                        animate: true,
                        animationDuration: 800,
                        fit: true,
                        padding: 40,
                        randomize: false,
                        nodeRepulsion: () => 12000,
                        idealEdgeLength: (edge) => Math.max(40, 180 / edge.data('weight')),
                        edgeElasticity: (edge) => edge.data('weight') * 80,
                        gravity: 0.4
                    }).run();
                }
            });

            // 3. Fetch and Load Memories for Keep View
            async function loadKeepMemories() {
                try {
                    let url = currentSearchQuery 
                        ? `/api/search?q=${encodeURIComponent(currentSearchQuery)}`
                        : `/api/log?offset=0&limit=50`;
                    
                    const res = await fetch(url);
                    keepMemories = await res.json();
                    renderKeepGrid();
                } catch (err) {
                    keepGrid.innerHTML = `<div style="color: var(--del-color); padding: 20px;">Erreur de chargement: ${err.message}</div>`;
                }
            }

            // Keep View Filter Tabs
            document.querySelectorAll('.filter-pill[data-filter]').forEach(pill => {
                pill.addEventListener('click', () => {
                    document.querySelectorAll('.filter-pill[data-filter]').forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    activeKeepFilter = pill.getAttribute('data-filter');
                    renderKeepGrid();
                });
            });

            function renderCommitPill() {
                const existingPill = document.getElementById('commit-filter-pill');
                if (existingPill) existingPill.remove();

                if (activeCommitFilter) {
                    const pillBtn = document.createElement('button');
                    pillBtn.className = 'filter-pill active commit-pill';
                    pillBtn.id = 'commit-filter-pill';
                    pillBtn.innerHTML = `Commit: #${activeCommitFilter.hash} <span class="remove-pill-btn" title="Effacer le filtre">✕</span>`;
                    
                    pillBtn.addEventListener('click', (e) => {
                        activeCommitFilter = null;
                        renderCommitPill();
                        renderKeepGrid();
                    });
                    
                    keepFilterBar.appendChild(pillBtn);
                }
            }

            function renderKeepGrid() {
                renderCommitPill();

                let filtered = keepMemories;

                // Tab Filter
                if (activeKeepFilter === 'modified') {
                    filtered = filtered.filter(m => m.has_modified || (m.changes && m.changes.some(c => (typeof c === 'string' ? 'modified' : c.action) !== 'consulted')));
                } else if (activeKeepFilter === 'consulted') {
                    filtered = filtered.filter(m => m.has_consulted || (m.changes && m.changes.some(c => (typeof c === 'string' ? 'modified' : c.action) === 'consulted')));
                }

                // Commit Hash Filter
                if (activeCommitFilter) {
                    const targetMem = keepMemories.find(m => (m.id || m.memory_id) === activeCommitFilter.id);
                    const targetPaths = targetMem ? (targetMem.changes || []).map(c => typeof c === 'string' ? c : c.path) : [];

                    filtered = filtered.filter(m => {
                        const mId = m.id || m.memory_id;
                        if (mId === activeCommitFilter.id) return true;
                        const mPaths = (m.changes || []).map(c => typeof c === 'string' ? c : c.path);
                        return mPaths.some(p => targetPaths.includes(p));
                    });
                }

                if (filtered.length === 0) {
                    keepGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">Aucune mémoire trouvée pour ce filtre.</div>`;
                    return;
                }

                keepGrid.innerHTML = filtered.map(m => {
                    const id = m.id || m.memory_id;
                    const dateStr = (m.timestamp || '').substring(0, 10);
                    const shortId = id ? id.substring(0, 8) : '';
                    const snippet = m.snippet || m.note || '';
                    const themeClass = getCardThemeClass(m);

                    // Find media blob if any
                    let mediaHash = null;
                    if (m.changes) {
                        const mediaChange = m.changes.find(c => typeof c !== 'string' && isImageFile(c.path) && c.blob_hash);
                        if (mediaChange) mediaHash = mediaChange.blob_hash;
                    }

                    const added = m.lines_added || 0;
                    const removed = m.lines_removed || 0;
                    const consultedCount = m.changes ? m.changes.filter(c => (typeof c === 'string' ? 'modified' : c.action) === 'consulted').length : 0;
                    const primaryPath = m.changes && m.changes[0] ? (typeof m.changes[0] === 'string' ? m.changes[0] : m.changes[0].path) : null;

                    return `
                        <div class="keep-card ${themeClass}" data-memory-id="${id}" data-primary-path="${escapeHtml(primaryPath || '')}">
                            <div>
                                <div class="keep-card-header">
                                    <h3 class="keep-card-title">${escapeHtml(m.title || 'Mémoire')}</h3>
                                    <span class="keep-card-id">${shortId}</span>
                                </div>
                                <div class="keep-card-meta">
                                    <span>📅 ${dateStr}</span>
                                    <button class="commit-btn" data-commit-id="${id}" data-commit-hash="${shortId}" title="Filtrer par les fichiers de ce commit">
                                        🔖 Dernier commit: #${shortId}
                                    </button>
                                </div>
                                ${mediaHash ? `<img src="/api/blob/${mediaHash}" class="keep-media-thumb" loading="lazy" alt="Aperçu média" />` : ''}
                                <div class="keep-card-snippet">${escapeHtml(snippet)}</div>
                            </div>
                            <div class="keep-card-badges">
                                ${added > 0 ? `<span class="badge badge-add">+${added}</span>` : ''}
                                ${removed > 0 ? `<span class="badge badge-del">-${removed}</span>` : ''}
                                ${consultedCount > 0 ? `<span class="badge badge-view">👁 ${consultedCount}</span>` : ''}
                                ${(m.changes || []).slice(0, 3).map(c => {
                                    const cPath = typeof c === 'string' ? c : c.path;
                                    return `<span class="badge badge-file" data-file-path="${escapeHtml(cPath)}" title="Historique de ${escapeHtml(cPath)}">${escapeHtml(cPath.split('/').pop())}</span>`;
                                }).join('')}
                                <button class="detail-btn" data-detail-id="${id}" title="Ouvrir les détails et arborescence">Détails 🔍</button>
                            </div>
                        </div>
                    `;
                }).join('');

                // Bind Keep Card Actions
                document.querySelectorAll('.keep-card').forEach(card => {
                    // Clicking card body -> opens File History for primary file
                    card.addEventListener('click', (e) => {
                        const primaryPath = card.getAttribute('data-primary-path');
                        if (primaryPath) {
                            openFileHistoryModal(primaryPath);
                        } else {
                            const memoryId = card.getAttribute('data-memory-id');
                            openDetailModal(memoryId);
                        }
                    });
                });

                // Bind Commit Filter Button Clicks
                document.querySelectorAll('.commit-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation(); // prevent triggering card click
                        const commitId = btn.getAttribute('data-commit-id');
                        const commitHash = btn.getAttribute('data-commit-hash');
                        activeCommitFilter = { id: commitId, hash: commitHash };
                        renderKeepGrid();
                    });
                });

                // Bind File Badge Clicks (Opens File History)
                document.querySelectorAll('.badge-file').forEach(badge => {
                    badge.addEventListener('click', (e) => {
                        e.stopPropagation(); // prevent triggering card click
                        const filePath = badge.getAttribute('data-file-path');
                        if (filePath) openFileHistoryModal(filePath);
                    });
                });

                // Bind Detail Button Clicks
                document.querySelectorAll('.detail-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const memId = btn.getAttribute('data-detail-id');
                        openDetailModal(memId);
                    });
                });
            }

            // 4. Search Logic with Debounce & AbortController
            searchInput.addEventListener('input', () => {
                const query = searchInput.value.trim();
                currentSearchQuery = query;

                if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() => {
                    executeSearch(query);
                }, 300);
            });

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
                    executeSearch(searchInput.value.trim());
                }
            });

            resetBtn.addEventListener('click', () => {
                searchInput.value = '';
                currentSearchQuery = '';
                if (searchAbortController) searchAbortController.abort();
                resetSearch();
            });

            async function executeSearch(query) {
                if (searchAbortController) {
                    searchAbortController.abort();
                }
                searchAbortController = new AbortController();

                if (!query) {
                    resetSearch();
                    return;
                }

                searchSpinner.style.display = 'block';
                resetBtn.style.display = 'none';

                try {
                    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`, {
                        signal: searchAbortController.signal
                    });
                    const results = await res.json();
                    searchSpinner.style.display = 'none';
                    resetBtn.style.display = 'block';

                    if (currentView === 'graph') {
                        renderGraphSearchResults(results);
                    } else {
                        keepMemories = results;
                        renderKeepGrid();
                    }
                } catch (err) {
                    if (err.name === 'AbortError') return;
                    console.error("Search fetch error", err);
                    searchSpinner.style.display = 'none';
                    resetBtn.style.display = 'block';
                }
            }

            function resetSearch() {
                searchSpinner.style.display = 'none';
                resetBtn.style.display = 'none';
                if (cy) {
                    cy.batch(() => {
                        cy.elements().removeClass('highlight dim selected neighbor neighbor-edge');
                        cy.nodes().removeData('relevance');
                    });
                }
                if (currentView === 'keep') {
                    loadKeepMemories();
                } else {
                    loadGitLogSidebar();
                }
            }

            // Render Search in Graph Sidebar
            function renderGraphSearchResults(memories) {
                sidebar.classList.add('open');
                resultsTitle.innerText = `${memories.length} Résultat(s)`;

                if (memories.length === 0) {
                    resultsContent.innerHTML = `<p style="color: var(--text-muted);">Aucun résultat pour cette recherche.</p>`;
                    return;
                }

                resultsContent.innerHTML = memories.map(c => `
                    <div class="keep-card theme-modified" style="margin-bottom: 12px;" data-memory-id="${c.memory_id}">
                        <h3 class="keep-card-title">${escapeHtml(c.title)}</h3>
                        <div class="keep-card-meta">
                            <span>${(c.timestamp || '').substring(0, 10)}</span>
                            <span>Score: ${c.score.toFixed(3)}</span>
                        </div>
                        <p class="keep-card-snippet">${escapeHtml(c.snippet)}</p>
                    </div>
                `).join('');

                document.querySelectorAll('#resultsContent .keep-card').forEach(card => {
                    card.addEventListener('click', () => {
                        openDetailModal(card.getAttribute('data-memory-id'));
                    });
                });
            }

            // Sidebar Git Log
            async function loadGitLogSidebar() {
                resultsTitle.innerText = "Git Log";
                resultsContent.innerHTML = '<div style="text-align:center; padding: 20px;"><div class="spinner" style="display:inline-block;"></div></div>';
                sidebar.classList.add('open');

                try {
                    const res = await fetch('/api/log?offset=0&limit=20');
                    const logs = await res.json();

                    resultsContent.innerHTML = logs.map(c => `
                        <div class="keep-card theme-modified" style="margin-bottom: 12px;" data-memory-id="${c.id}">
                            <h3 class="keep-card-title">${escapeHtml(c.title)}</h3>
                            <div class="keep-card-meta">
                                <span>${(c.timestamp || '').substring(0, 10)}</span>
                                <span class="keep-card-id">${c.id.substring(0, 8)}</span>
                            </div>
                            <div class="keep-card-badges">
                                ${c.lines_added > 0 ? `<span class="badge badge-add">+${c.lines_added}</span>` : ''}
                                ${c.lines_removed > 0 ? `<span class="badge badge-del">-${c.lines_removed}</span>` : ''}
                            </div>
                        </div>
                    `).join('');

                    document.querySelectorAll('#resultsContent .keep-card').forEach(card => {
                        card.addEventListener('click', () => {
                            openDetailModal(card.getAttribute('data-memory-id'));
                        });
                    });
                } catch (err) {
                    resultsContent.innerHTML = `<p style="color: var(--del-color);">Erreur: ${err.message}</p>`;
                }
            }

            // 5. Full Detail Modal (2-Column Desktop & Bottom-Sheet Mobile)
            async function openDetailModal(memoryId, initialSelectedPath = null) {
                modalOverlay.style.display = 'flex';
                modalTitle.innerText = 'Chargement...';
                modalMeta.innerHTML = '';
                modalLeftCol.innerHTML = '<div style="text-align:center; padding: 40px;"><div class="spinner" style="display:inline-block; width:24px; height:24px;"></div></div>';
                modalRightCol.innerHTML = '';

                try {
                    const res = await fetch(`/api/memory/${memoryId}`);
                    const memory = await res.json();

                    if (memory.error) {
                        modalTitle.innerText = 'Erreur';
                        modalLeftCol.innerHTML = `<p style="color: var(--del-color);">${memory.error}</p>`;
                        return;
                    }

                    modalTitle.innerText = memory.title || 'Détails du Commit';
                    modalMeta.innerHTML = `
                        <span>📅 ${(memory.timestamp || '').substring(0, 19).replace('T', ' ')}</span>
                        <span class="keep-card-id">ID: ${memory.id.substring(0, 8)}</span>
                        ${memory.parent_id ? `<span class="keep-card-id" style="cursor:pointer;" title="Aller au parent" id="parentMemoryBtn">Parent: ${memory.parent_id.substring(0, 8)}</span>` : ''}
                    `;

                    if (document.getElementById('parentMemoryBtn')) {
                        document.getElementById('parentMemoryBtn').addEventListener('click', () => {
                            openDetailModal(memory.parent_id);
                        });
                    }

                    // Build Left Column: Metadata + Tree View
                    const changes = memory.changes || [];
                    const treeRoot = buildFileTree(changes);
                    const treeHtml = renderTreeNodes(treeRoot);

                    modalLeftCol.innerHTML = `
                        <div class="modal-note">${escapeHtml(memory.note || 'Aucune note associée.')}</div>
                        <h3 class="modal-section-title">Fichiers touchés (${changes.length})</h3>
                        <div class="tree-container">
                            ${treeHtml || '<div style="color: var(--text-muted);">Aucun fichier.</div>'}
                        </div>
                    `;

                    // Handle File Selection in Tree View
                    const fileItems = modalLeftCol.querySelectorAll('.tree-file-item');

                    async function selectFile(filePath) {
                        fileItems.forEach(item => {
                            if (item.getAttribute('data-path') === filePath) {
                                item.classList.add('selected');
                            } else {
                                item.classList.remove('selected');
                            }
                        });

                        const changeObj = changes.find(c => (typeof c === 'string' ? c : c.path) === filePath);
                        const action = changeObj ? (typeof changeObj === 'string' ? 'modified' : changeObj.action) : 'modified';
                        const blobHash = changeObj && typeof changeObj !== 'string' ? changeObj.blob_hash : null;

                        modalRightCol.innerHTML = '<div style="text-align:center; padding: 40px;"><div class="spinner" style="display:inline-block; width:28px; height:28px;"></div></div>';

                        // Check for image or PDF media preview
                        if (blobHash && (isImageFile(filePath) || isPdfFile(filePath))) {
                            if (isImageFile(filePath)) {
                                modalRightCol.innerHTML = `
                                    <h3 class="modal-section-title">Aperçu Média: ${escapeHtml(filePath)}</h3>
                                    <div class="modal-media-container">
                                        <img src="/api/blob/${blobHash}" class="modal-media-full" alt="Aperçu Média" />
                                    </div>
                                `;
                            } else {
                                modalRightCol.innerHTML = `
                                    <h3 class="modal-section-title">Document PDF: ${escapeHtml(filePath)}</h3>
                                    <div class="modal-media-container">
                                        <iframe src="/api/blob/${blobHash}" class="modal-pdf-embed"></iframe>
                                    </div>
                                `;
                            }
                            return;
                        }

                        // Fetch Unified Diff
                        try {
                            const diffRes = await fetch(`/api/diff?memory_id=${memoryId}&path=${encodeURIComponent(filePath)}`);
                            const diffData = await diffRes.json();

                            if (diffData.error) {
                                modalRightCol.innerHTML = `<div style="color: var(--del-color);">${escapeHtml(diffData.error)}</div>`;
                                return;
                            }

                            const linesAdded = diffData.lines_added || 0;
                            const linesRemoved = diffData.lines_removed || 0;

                            if (diffData.is_binary) {
                                modalRightCol.innerHTML = `
                                    <h3 class="modal-section-title">${escapeHtml(filePath)}</h3>
                                    <div style="color: var(--highlight); padding: 20px; text-align: center;">[Fichier binaire ou média non prévisualisable]</div>
                                `;
                                return;
                            }

                            const diffLines = (diffData.diff || '').split('\n');
                            const diffContentHtml = diffLines.map(line => {
                                let cls = '';
                                if (line.startsWith('+') && !line.startsWith('+++')) cls = 'diff-add';
                                else if (line.startsWith('-') && !line.startsWith('---')) cls = 'diff-del';
                                else if (line.startsWith('@@')) cls = 'diff-hunk';
                                return `<div class="diff-line ${cls}">${escapeHtml(line)}</div>`;
                            }).join('');

                            modalRightCol.innerHTML = `
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                                    <h3 class="modal-section-title" style="margin: 0;">${escapeHtml(filePath)}</h3>
                                    <div>
                                        ${linesAdded > 0 ? `<span class="badge badge-add">+${linesAdded}</span>` : ''}
                                        ${linesRemoved > 0 ? `<span class="badge badge-del">-${linesRemoved}</span>` : ''}
                                    </div>
                                </div>
                                <div class="diff-viewer">
                                    ${diffContentHtml || '<div style="color: var(--text-muted);">Aucune différence.</div>'}
                                </div>
                            `;

                        } catch (err) {
                            modalRightCol.innerHTML = `<div style="color: var(--del-color);">Erreur de chargement du diff: ${err.message}</div>`;
                        }
                    }

                    fileItems.forEach(item => {
                        item.addEventListener('click', () => {
                            selectFile(item.getAttribute('data-path'));
                        });
                    });

                    // Initial selection
                    const defaultPath = initialSelectedPath && changes.some(c => (typeof c === 'string' ? c : c.path) === initialSelectedPath)
                        ? initialSelectedPath
                        : (changes.length > 0 ? (typeof changes[0] === 'string' ? changes[0] : changes[0].path) : null);

                    if (defaultPath) {
                        selectFile(defaultPath);
                    } else {
                        modalRightCol.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 40px;">Sélectionnez un fichier dans l\'arborescence à gauche.</div>';
                    }

                } catch (err) {
                    modalTitle.innerText = 'Erreur';
                    modalLeftCol.innerHTML = `<p style="color: var(--del-color);">${err.message}</p>`;
                }
            }

            // 6. File History Modal
            async function openFileHistoryModal(filePath) {
                modalOverlay.style.display = 'flex';
                const fileName = filePath.split('/').pop();
                modalTitle.innerText = `📜 Historique du Fichier : ${fileName}`;
                modalMeta.innerHTML = `<span style="color: var(--text-muted); font-size: 11px;">${escapeHtml(filePath)}</span>`;
                modalLeftCol.innerHTML = '<div style="text-align:center; padding: 40px;"><div class="spinner" style="display:inline-block; width:24px; height:24px;"></div></div>';
                modalRightCol.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 40px;">Sélectionnez une révision dans l\'historique à gauche pour voir les détails.</div>';

                try {
                    const res = await fetch(`/api/file-history/${encodeURIComponent(filePath)}`);
                    const history = await res.json();

                    if (history.error || !Array.isArray(history)) {
                        modalLeftCol.innerHTML = `<p style="color: var(--del-color);">${history.error || 'Erreur lors du chargement de l\'historique'}</p>`;
                        return;
                    }

                    modalLeftCol.innerHTML = `
                        <div style="margin-bottom: 12px; color: var(--text-muted); font-size: 12px;">
                            ${history.length} révision(s) pour <code>${escapeHtml(fileName)}</code>
                        </div>
                        <div class="history-list">
                            ${history.map(item => `
                                <div class="keep-card theme-modified" style="margin-bottom: 10px; padding: 12px; min-height: auto;" data-memory-id="${item.memory_id}">
                                    <div class="keep-card-header" style="margin-bottom: 4px;">
                                        <h4 style="margin: 0; font-size: 14px; color: #f0f6fc;">${escapeHtml(item.title || 'Révision')}</h4>
                                    </div>
                                    <div class="keep-card-meta" style="margin: 0; font-size: 11px;">
                                        <span>📅 ${(item.timestamp || '').substring(0, 10)}</span>
                                        <span class="keep-card-id">${(item.memory_id || '').substring(0, 8)}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;

                    document.querySelectorAll('#modalLeftCol .keep-card').forEach(card => {
                        card.addEventListener('click', () => {
                            const memId = card.getAttribute('data-memory-id');
                            openDetailModal(memId, filePath);
                        });
                    });

                    // Automatically open latest commit in detail view
                    if (history.length > 0 && history[0].memory_id) {
                        openDetailModal(history[0].memory_id, filePath);
                    }

                } catch (err) {
                    modalLeftCol.innerHTML = `<p style="color: var(--del-color);">Erreur: ${err.message}</p>`;
                }
            }

            modalCloseBtn.addEventListener('click', () => {
                modalOverlay.style.display = 'none';
            });

            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) {
                    modalOverlay.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
